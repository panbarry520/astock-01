name: T1 Snapshot (14:45)

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t1-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 生成 14:45 正式快照
        run: node cloud/cloud_snapshot.js docs/t1_snapshot.json
      - name: 提交回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/t1_snapshot.json
          git commit -m "t1 snapshot $(date +%F)" --allow-empty
          git push
